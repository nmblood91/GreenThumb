[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenthumb"
version = "0.1.0"
description = "GreenThumb smart planter and automation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.2",
  "apscheduler>=3.10.4",
  "python-dotenv>=1.0.1",
]

[tool.setuptools]
packages = ["greenthumb", "greenthumb.hardware", "greenthumb.services"]
