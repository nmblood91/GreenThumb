[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenthumb"
version = "0.1.0"
description = "GreenThumb smart planter and automation platform"
readme = "README.md"
requires-python = ">=3.11"
# Exactly the packages greenthumb/ imports, as minimum versions. requirements.txt
# lists the same set pinned to exact versions and is what the Pi installs; keep
# the two in step. Anything imported only indirectly stays out of both --
# pydantic and python-dotenv arrive with pydantic-settings and are not imported
# here, so declaring them would be claiming a dependency that is not ours.
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pydantic-settings>=2.4.0",
  "apscheduler>=3.10.4",
  # Hardware buses: smbus2 for the soil sensors over I2C, spidev for the LED
  # strip over SPI, both imported by greenthumb.hardware.
  "smbus2>=0.4.3",
  "spidev>=3.6",
]

[tool.setuptools]
packages = ["greenthumb", "greenthumb.hardware", "greenthumb.services"]
